<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Move Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one phone column matching the user's mockup; full-screen on a phone, framed on desktop. Single light theme by design. */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#14161A; --muted:#5B616E; --faint:#8A909B; --line:#E6E8EC;
  --red:#E0202F; --red-soft:#FDECEE; --green:#178A4C; --blue:#2D6FE0; --blue-soft:#EAF1FB;
  --track:#E3E5EA; --shade:rgba(20,22,26,.45); --desk:#D9DCE1;
  --font:'Nunito Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.phone{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;padding-block:24px}
  .phone{height:min(900px,calc(100vh - 48px));width:400px;border-radius:44px;border:10px solid var(--ink);box-shadow:0 30px 60px rgba(0,0,0,.25)}
}
.demo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px max(14px,env(safe-area-inset-right,0px)) 7px max(14px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--card);font-size:12px;flex:none}
.demo b{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:10px;color:#B8BDC5}
.seg{display:flex;background:#2A2D33;border-radius:99px;padding:3px}
.seg button{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;color:#C9CDD3}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.reset{font-size:12px;font-weight:700;color:#C9CDD3}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.pad{padding:8px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(20,22,26,.04)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .pos{color:var(--green)} .neg{color:var(--red)}
.chev{flex:none;color:var(--ink)}
/* headers */
.hdr{position:sticky;top:0;z-index:6;background:var(--bg);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
.hdr .t{text-align:center}
.hdr h1{margin:0;font-size:18px;font-weight:800}
.hdr .s{font-size:13px;color:var(--muted)}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 3px rgba(20,22,26,.08)}
.prof{position:relative;justify-self:end}
.prof i{position:absolute;top:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--red);color:var(--card);font-size:10px;font-style:normal;font-weight:800;display:grid;place-items:center}
/* home */
.fuel{display:flex;flex-direction:column;gap:2px}
.fuel strong{font-size:20px;font-weight:900;display:flex;align-items:center;gap:6px}
.fuel .bar{height:5px;border-radius:9px;background:var(--track);width:110px;margin-top:6px;overflow:hidden}
.fuel .bar i{display:block;height:100%;width:62%;background:var(--blue)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tabs span{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:99px;background:var(--card);font-weight:700;border:1px solid var(--line)}
.tabs span.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs em{width:7px;height:7px;border-radius:50%;background:var(--red)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px}
.hero img{width:86%;max-width:330px;height:auto;}
.info{padding:5px 18px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px}
.remote{border-radius:18px;overflow:hidden;background:var(--card)}
.remote .tip{background:var(--blue-soft);text-align:center;font-size:12px;padding:8px;color:var(--muted)}
.remote .row{display:flex;justify-content:space-around;padding:14px 8px}
.remote .row span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 2px 8px rgba(20,22,26,.1)}
.remote .row span.on{background:var(--ink);color:var(--card);width:64px;height:64px}
.nmcard{display:flex;flex-direction:column;gap:12px}
.nmrow{display:flex;gap:12px;align-items:center;width:100%}
.tile{flex:none;width:44px;height:44px;border-radius:12px;background:var(--red-soft);display:grid;place-items:center;color:var(--red)}
.nmrow .b{flex:1;min-width:0}
.nmrow h3{margin:0;font-size:16px;font-weight:800}
.nmrow p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.nmrow p b{color:var(--ink);font-weight:800}
.nmrow p b.pos{color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:99px;background:var(--ink);color:var(--card);font-weight:800;font-size:16px}
.btn.sm{min-height:40px;font-size:15px}
.btn[disabled]{opacity:.35;cursor:default}
/* next move */
.sum .top{display:flex;gap:14px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sum .top .ic{flex:none;color:var(--red);padding-top:2px}
.sum .k{font-size:15px;font-weight:700}
.sum h2{margin:2px 0 4px;font-size:20px;font-weight:900;line-height:1.2;text-wrap:balance}
.sum p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.three{display:grid;grid-template-columns:repeat(3,1fr);padding-top:12px}
.three div{padding:0 8px;border-left:1px solid var(--line);min-width:0}
.three div:first-child{border-left:0;padding-left:0}
.three span{display:block;font-size:12px;color:var(--muted)}
.three strong{display:block;font-size:19px;font-weight:900;margin-top:6px}
.three small{font-size:12px;color:var(--muted)}
.sec{margin:6px 2px -2px;font-size:19px;font-weight:900}
.secsub{margin:-6px 2px 0;color:var(--muted);font-size:14px;line-height:1.45}
.opt{display:flex;gap:14px;align-items:center;width:100%;border:2px solid transparent}
.opt.rec{border-color:var(--red)}
.opt .ic{flex:none;align-self:flex-start;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.opt .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt h3{margin:0;font-size:16px;font-weight:800}
.opt .d{font-size:13px;color:var(--muted)}
.opt .v{font-size:19px;font-weight:900;margin-top:2px}
.opt .v2{font-size:17px;font-weight:800}
.opt .fine{font-size:12px;color:var(--muted);line-height:1.4}
.badge{flex:none;background:var(--red);color:var(--card);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.sl{display:flex;flex-direction:column;gap:10px}
.sl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl label{font-size:14px;font-weight:700}
.sl output{font-weight:900;font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(to right,var(--red) var(--p,40%),var(--track) var(--p,40%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,22,26,.25);margin-top:-10px}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--red)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,22,26,.25)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-6px}
.proj{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.proj .row strong{font-size:26px;font-weight:900}
.pbar{position:relative;height:16px;border-radius:99px;background:var(--track);overflow:visible}
.pbar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--red);transition:width .15s}
.pbar i.ok{background:var(--green)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:11px;height:11px;border-radius:50%;background:var(--red)}
.legend .dot.ok{background:var(--green)}
.alert{display:flex;align-items:center;gap:12px;background:var(--red-soft);border-radius:12px;padding:12px}
.alert.ok{background:#E8F5EE}
.alert .x{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--card);display:grid;place-items:center;font-weight:900}
.alert.ok .x{background:var(--green)}
.alert .b{flex:1;min-width:0}
.alert .l1{display:flex;justify-content:space-between;font-weight:800;gap:8px}
.alert .l2{text-align:right;font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.ai-btn{display:flex;align-items:center;gap:12px;width:100%}
.ai-dot{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:12px;font-weight:900}
.cta{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:10px max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 16px var(--bg)}
.links{display:flex;justify-content:space-around;padding:10px 0 6px}
.links button{font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.foot{text-align:right;font-size:11px;color:var(--faint);padding:0 max(16px,env(safe-area-inset-right,0px)) 8px 16px}
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.nav .mid{width:50px;height:50px;border-radius:50%;background:var(--red);display:grid;place-items:center}
/* sheet */
.shade{position:absolute;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet.anim{animation:up .25s ease}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}.pbar i{transition:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.shhead{display:flex;justify-content:space-between;align-items:center}
.shhead h2{margin:0;font-size:20px;font-weight:900}
.ai{display:flex;gap:10px;align-items:flex-start}
.ai .ai-dot{width:30px;height:30px;font-size:11px}
.bubble{background:var(--bg);border-radius:4px 18px 18px 18px;padding:12px 14px;line-height:1.5;min-width:0}
.bubble b{font-weight:900}
.me{align-self:flex-end;background:var(--ink);color:var(--card);border-radius:18px 4px 18px 18px;padding:10px 14px;font-weight:700;max-width:80%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px}
.chips button:disabled{opacity:.4;cursor:default}
.trust{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
/* step + done */
.h-xl{font-size:24px;font-weight:900;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.facts{display:flex;flex-direction:column;gap:12px}
.fact{display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.ck{flex:none;width:24px;height:24px;border-radius:50%;background:#E8F5EE;color:var(--green);display:grid;place-items:center;font-weight:900;font-size:13px}
.radio{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;border:2px solid transparent;width:100%}
.radio[aria-pressed="true"]{border-color:var(--ink)}
.radio .r{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.radio[aria-pressed="true"] .r{border:7px solid var(--ink)}
.radio strong{display:block;font-weight:800}
.radio small{color:var(--muted);font-size:13px}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 8px;font-weight:800;font-size:14px;flex:1 1 28%;text-align:center}
.slots button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.label{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
.ok-big{width:72px;height:72px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:16px auto 0}
.center{text-align:center}
.list div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list div:last-child{border:0}
.list span{color:var(--muted)} .list strong{font-weight:800;text-align:right}
ol.next{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45;text-align:left}
</style>

  function onClick(e){

    if (b.disabled) return;
    if (b.dataset.go){ if(b.dataset.go==='step'){S.slot=null;S.call=null;S.forceAdv=false;} if(b.dataset.go==='home'){S.forceAdv=false;} S.screen=b.dataset.go;S.sheet=false;render();return;}
    if (b.dataset.advocate){S.forceAdv=true;S.call=null;S.screen='step';render();return;}
    if (b.dataset.sheet){S.sheet=true;S.anim=true;render(true);S.anim=false;return;}
    if (b.dataset.ask){var q=OPTQ[b.dataset.ask]; if(S.chat.indexOf(q)<0)S.chat.push(q); S.sheet=true;S.anim=true;render(true);S.anim=false;return;}
    if (b.dataset.q){if(S.chat.indexOf(b.dataset.q)<0)S.chat.push(b.dataset.q);render(true);return;}
    if (b.dataset.choice){S.choice=b.dataset.choice;S.slot=null;render(true);return;}
    if (b.dataset.slot){S.slot=b.dataset.slot;render(true);return;}
    if (b.dataset.call){S.call=b.dataset.call;render(true);return;}
    if (b.dataset.confirm){S.screen='done';render();return;}
  }
  el.addEventListener('click',onClick); host.addEventListener('click',onClick);
  function setWho(w){
    S.who=w;S.screen='home';S.sheet=false;S.chat=[];S.pace=1360;S.slot=null;S.call=null;S.forceAdv=false;S.choice='inspect';
    document.getElementById('p-maria').setAttribute('aria-pressed',w==='maria');
    document.getElementById('p-carlos').setAttribute('aria-pressed',w==='carlos');
    render();
  }
  document.getElementById('p-maria').onclick=function(){setWho('maria')};
  document.getElementById('p-carlos').onclick=function(){setWho('carlos')};
  document.getElementById('reset').onclick=function(){setWho(S.who)};
  render();
})();
</script>

</body></html>
